[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triada"
version = "0.5.0"
description = "Motor de auditoría y optimización SEO, SEM y GEO para webs de empresa"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["mcp>=2,<3"]   # conector para Claude (servidor MCP local)

[project.scripts]
triada = "triada.cli:main"
triada-claude = "triada.conector_claude:main"

[tool.setuptools.packages.find]
include = ["triada*"]

[tool.setuptools.package-data]
triada = ["templates/*.html", "app/static/*", "app/demo_sitio/*", "app/demo_sitio/**/*", "app/demo_datos/*"]
