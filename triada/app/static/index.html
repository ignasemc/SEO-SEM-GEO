<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tríada · SEO, SEM y GEO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='10' cy='20' r='7' fill='%232f6f4f'/><circle cx='22' cy='20' r='7' fill='%232b5aa8' fill-opacity='.85'/><circle cx='16' cy='10' r='7' fill='%238a4fb0' fill-opacity='.85'/></svg>">
<style>
:root{
  --fg:#1b1d21;--muted:#646b76;--soft:#8b919b;--line:#e4e2dd;--bg:#f6f5f2;--card:#fff;--hover:#f0efeb;
  --seo:#2f6f4f;--seo-bg:#e7f1ec;--sem:#2b5aa8;--sem-bg:#e6edf8;--geo:#8a4fb0;--geo-bg:#f2eaf7;
  --crit:#b42318;--alta:#c4570c;--media:#9a7400;--baja:#646b76;--ok:#2f6f4f;
  --r:10px;--sombra:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.04);
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sem)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;background:linear-gradient(to right,#fbfaf8 235px,var(--line) 235px,var(--line) 236px,transparent 236px)}
/* barra lateral */
aside{padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo b{font-size:19px;letter-spacing:-.01em}.logo small{display:block;color:var(--muted);font-size:11.5px;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--hover)}.nav a.on{background:#fff;box-shadow:var(--sombra);border:1px solid var(--line);padding:7px 9px}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);padding:16px 10px 4px}
.punto{width:9px;height:9px;border-radius:50%;flex:none}
.nav .pts{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
aside .pie{margin-top:auto;font-size:11.5px;color:var(--soft);padding:0 10px;word-break:break-all}
/* principal */
main{padding:22px 34px 70px;max-width:1200px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em}.top .esp{flex:1}
.sub{color:var(--muted);font-size:13px}
select.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:340px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:550;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--hover)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--fg);border-color:var(--fg);color:#fff}.btn.pri:hover{background:#000}
.btn.seo{background:var(--seo);border-color:var(--seo);color:#fff}.btn.sem{background:var(--sem);border-color:var(--sem);color:#fff}.btn.geo{background:var(--geo);border-color:var(--geo);color:#fff}
.btn.peq{padding:5px 10px;font-size:13px}.btn.link{border:0;background:none;color:var(--sem);padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:18px 20px}
h2{font-size:16px;margin:30px 0 12px;letter-spacing:-.005em}h3{font-size:15px;margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.grid3,.grid2{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto}}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;color:#fff;letter-spacing:.02em}
.t-seo{background:var(--seo)}.t-sem{background:var(--sem)}.t-geo{background:var(--geo)}
.sev{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.s-critica{color:var(--crit)}.s-alta{color:var(--alta)}.s-media{color:var(--media)}.s-baja{color:var(--baja)}
/* puntuación */
.score{padding:16px 16px;display:flex;gap:14px;min-width:0;align-items:center;cursor:pointer;transition:transform .12s}
.score:hover{transform:translateY(-1px)}
.anillo{--v:0;--c:var(--seo);width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),#ecebe7 0)}
.anillo span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.score .det{flex:1;min-width:0}.score .det b{font-size:15px}
.delta{font-size:12.5px;font-weight:650}.delta.up{color:var(--ok)}.delta.down{color:var(--crit)}
.acc{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* tablas */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#faf9f7;position:sticky;top:0}
tr:last-child td{border-bottom:0}td.num{font-variant-numeric:tabular-nums;text-align:right}
.tabla{overflow:auto;max-height:520px}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
.si{color:var(--ok);font-weight:650}.no{color:var(--crit);font-weight:650}.aviso{color:var(--alta);font-weight:650}
/* issues */
.issue{padding:14px 18px;margin-bottom:10px}
.issue h3{margin:5px 0 4px;font-size:14.5px}.issue p{margin:4px 0;color:#3a3e45}
.conf{background:#fff7e6;border-left:3px solid var(--media);padding:6px 10px;border-radius:4px;font-size:13.5px;margin-top:8px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
details ul{margin:6px 0;padding-left:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:550}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
/* pestañas de rama */
.cabrama{display:flex;align-items:center;gap:20px;padding:20px 22px;margin-bottom:18px;border-radius:var(--r)}
.cabrama.seo{background:var(--seo-bg)}.cabrama.sem{background:var(--sem-bg)}.cabrama.geo{background:var(--geo-bg)}
.cabrama h1{margin:0;font-size:22px}.cabrama p{margin:2px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--fg);border-color:var(--fg)}
/* solucionar */
.destino{display:grid;grid-template-columns:1fr 1fr;gap:12px}.destino.d3{grid-template-columns:repeat(3,minmax(0,1fr))}
.exportar .botones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media(max-width:1000px){.destino.d3{grid-template-columns:1fr}}
.opc{display:flex;gap:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer;background:#fff}
.opc.on{border-color:var(--fg)}.opc input{margin-top:3px}.opc small{color:var(--muted);display:block}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.grupo{margin-bottom:14px;overflow:hidden}
.grupo>header{padding:11px 16px;background:#faf9f7;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.fix{display:grid;grid-template-columns:26px 1fr;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.fix:last-child{border-bottom:0}.fix.aplicada{background:#f6faf7}
.fix .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.fix .actual{font-size:13px;color:var(--muted);margin:4px 0;word-break:break-word}
.fix textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;resize:vertical;min-height:38px;background:#fff}
.fix textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:110px}
.fix .nota{font-size:12.5px;color:var(--soft);margin-top:3px}
.est{font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px}
.est.lista{background:#e7f1ec;color:var(--ok)}.est.datos{background:#fff1e0;color:var(--alta)}.est.hecha{background:var(--fg);color:#fff}
.banner{padding:14px 18px;border-radius:var(--r);margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ia-card{margin-bottom:14px;border:1.5px solid #e3dcf3;background:#fbf9ff}
.progreso{height:8px;background:#eee;border-radius:99px;margin-top:10px;overflow:hidden}.progreso div{height:100%;background:var(--geo)}
.est.ia{background:#efe9fb;color:#6b4bb5}.iafix{font-size:12.5px;color:#5a4a86;margin-top:4px}.iafix .kw{color:var(--muted);margin-top:2px}
.banner.ok{background:#e7f1ec}.banner ul.motivos{margin:6px 0;padding-left:18px}.banner.mal{background:#fdecea}
/* formularios */
label.f{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
input.i,textarea.i{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
input.i:focus,textarea.i:focus{outline:2px solid #c9d6ee;border-color:var(--sem)}
.ayuda{font-size:12.5px;color:var(--muted);margin-top:4px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ramasel{display:flex;gap:10px}.ramasel label{display:flex;gap:7px;align-items:center;padding:8px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:#fff;font-weight:600}
.camp{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.progreso{height:8px;background:#ecebe7;border-radius:4px;overflow:hidden;margin:12px 0}.progreso i{display:block;height:100%;background:var(--fg);transition:width .3s}
/* varios */
.vacio{text-align:center;padding:50px 20px}.vacio h1{font-size:26px;margin:0 0 8px}
.inicio{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px;text-align:left}
.inicio .card{padding:24px}.inicio p{color:var(--muted)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--fg);color:#fff;padding:11px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:9;max-width:420px}
.toast.mal{background:var(--crit)}
.lista-inf .card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.lista-inf .botones{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}
svg text{font-family:inherit}
/* capas */
.score2{padding:16px 18px;cursor:pointer;min-width:0;transition:transform .12s}.score2:hover{transform:translateY(-1px)}
.score2 .capas{margin-top:14px}
.capas{display:flex;flex-direction:column;gap:5px;margin:8px 0 2px;font-size:12.5px}
.capa{display:grid;grid-template-columns:112px minmax(30px,1fr) 58px;gap:8px;align-items:center}.capa>span:first-child{white-space:nowrap;font-size:12px}
.capa .b{height:6px;background:#ecebe7;border-radius:3px;overflow:hidden}.capa .b i{display:block;height:100%}
.capa .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}.capa .v.sd{color:var(--soft);font-weight:500}
.cob{font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;background:#ecebe7;color:var(--muted)}
.cob.prov{background:#fff1e0;color:var(--alta)}
.anillo.solo{background:repeating-conic-gradient(#d9d7d1 0 2deg,#ecebe7 2deg 6deg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:6px 11px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--fg);color:#fff}.seg button.on.si{background:var(--ok)}.seg button.on.no{background:var(--crit)}.seg button.on.parcial{background:var(--media)}
.preg{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line)}
.preg:last-child{border-bottom:0}.preg b{font-weight:600}
.medido{display:inline-block;margin-top:5px;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sem-bg);color:var(--sem)}
.acc-card{display:grid;grid-template-columns:150px 1fr 230px;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.acc-card:last-child{border-bottom:0}.acc-card.cerrada{opacity:.62}
.acc-card select,.acc-card input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.acc-card .lado{display:flex;flex-direction:column;gap:6px}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;background:#ecebe7;color:var(--muted);font-weight:600}
.ok-v{font-size:11.5px;padding:1px 8px;border-radius:999px;background:#e7f1ec;color:var(--ok);font-weight:650}
.barh{display:grid;grid-template-columns:180px 1fr 54px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}
.barh .b{height:14px;background:#ecebe7;border-radius:4px;overflow:hidden}.barh .b i{display:block;height:100%;background:#b9b6ae}
.barh.tu .b i{background:var(--geo)}.barh.tu{font-weight:700}
.simul{background:#fff1e0;color:var(--alta);font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.met{padding:12px 14px}.met b{display:block;font-size:20px}.met span{font-size:12px;color:var(--muted)}
@media(max-width:1000px){.acc-card{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
.oculto{display:none}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 32 32"><circle cx="10" cy="20" r="7" fill="#2f6f4f"/><circle cx="22" cy="20" r="7" fill="#2b5aa8" fill-opacity=".85"/><circle cx="16" cy="10" r="7" fill="#8a4fb0" fill-opacity=".85"/></svg>
      <div><b>Tríada</b><small>SEO · SEM · GEO</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="pie" id="pie"></div>
  </aside>
  <main id="vista"></main>
</div>
<div id="toast" class="toast oculto"></div>

<script>
"use strict";
const RAMAS = {
  seo: {nombre: "SEO", corto: "Orgánico", titulo: "Posicionamiento orgánico", desc: "Google y Bing: rastreo, contenido, estructura y datos estructurados."},
  sem: {nombre: "SEM", corto: "Anuncios", titulo: "Publicidad de pago", desc: "Google Ads: medición, Consent Mode y calidad de las páginas de destino."},
  geo: {nombre: "GEO", corto: "IA", titulo: "Buscadores con IA", desc: "ChatGPT, Perplexity, AI Overviews, Gemini, Claude: acceso, entidad de marca y contenido citable."},
};
const TIPO_FIX = {titulo: "Título", meta_description: "Meta descripción", h1: "Encabezado H1", canonical: "Canonical",
  lang: "Idioma", jsonld: "Datos estructurados", jsonld_breadcrumb: "Migas de pan (schema)", meta_robots: "Meta robots",
  archivo: "Archivo", snippet_head: "Fragmento en <head>"};
const SEVS = ["critica", "alta", "media", "baja"];
const REVISAR = "«REVISAR»";

const S = {lista: [], actual: null, info: {}, sev: "todas", ediciones: {}, sel: {seo: {}, sem: {}, geo: {}}, destino: "carpeta",
           carpeta: "", ultimoResultado: null, trabajo: null, demo: null, ext: null, ajustes: null,
           accRama: "todas", accEstado: "abiertas", monitorT: null};

// ------------------------------------------------------------ utilidades
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ruta = u => { try { const x = new URL(u); return x.pathname + x.search; } catch { return u || "—"; } };
const fecha = iso => new Date(iso).toLocaleString("es-ES", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
function toast(msg, mal) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (mal ? " mal" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast oculto", mal ? 6000 : 3500);
}
async function api(p, opt = {}) {
  const r = await fetch(p, {method: opt.method || (opt.body ? "POST" : "GET"),
    headers: {"Content-Type": "application/json", "X-Triada": "1"},
    body: opt.body ? JSON.stringify(opt.body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
function color(v) { return v >= 80 ? "var(--ok)" : v >= 50 ? "var(--media)" : "var(--crit)"; }
function anillo(r, v) { return `<div class="anillo" style="--v:${v};--c:var(--${r})"><span style="color:${color(v)}">${v}</span></div>`; }
function tags(ramas, excepto) { return (ramas || []).filter(r => r !== excepto).sort().map(r => `<span class="tag t-${r}">${excepto ? "+" : ""}${r.toUpperCase()}</span>`).join(" "); }
function previo(a) {
  // análisis anterior de la misma web
  const mismos = S.lista.filter(x => x.host === a.host);
  const i = mismos.findIndex(x => x.id === a.id);
  return i >= 0 ? mismos[i + 1] : null;
}
function aplicadasCarpeta(a) {
  const s = new Set();
  (a.aplicaciones || []).filter(x => !x.deshecha).forEach(x => x.aplicados.forEach(id => s.add(id)));
  return s;
}
function aplicadasSubidas() { return new Set((S.subidas && S.subidas.aplicados) || []); }
function aplicadas(a) { return new Set([...aplicadasCarpeta(a), ...aplicadasSubidas()]); }
function aplicadasDestino(a) { return S.destino === "subidos" ? aplicadasSubidas() : aplicadasCarpeta(a); }
function valorFix(f) { return S.ediciones[f.id] ?? f.valor_propuesto; }
// la selección va por vertiente: marcar en SEO no marca nada en SEM ni en GEO
function selVacia() { return {seo: {}, sem: {}, geo: {}}; }
function fixLista(f) { return !valorFix(f).includes(REVISAR) && valorFix(f).trim() !== ""; }
function tipoFix(t) { return t.startsWith("alt:") ? "Texto alternativo (alt)" : (TIPO_FIX[t] || t); }

// ------------------------------------------------------------ carga
async function cargarLista() { S.lista = await api("/api/analisis"); }
async function abrir(id) {
  if (!id) { S.actual = null; return; }
  const nuevo = !S.actual || S.actual.id !== id;
  if (S.actual && S.actual.id !== id) { S.ediciones = {}; S.sel = selVacia(); S.ultimoResultado = null; }
  S.actual = await api("/api/analisis/" + id);
  S.ediciones = {...(S.actual.ediciones || {}), ...(nuevo ? {} : S.edLocales || {})};
  if (nuevo) S.edLocales = {};
  S.subidas = await api("/api/subidas/" + id);
  if (nuevo) S.destino = S.actual.carpeta_sitio ? "carpeta" : "subidos";
  S.carpeta = S.actual.carpeta_sitio || S.carpeta || "";
  S.ext = await api("/api/proyecto/" + S.actual.proyecto);
  localStorage && (() => { try { localStorage.setItem("triada.actual", id); } catch {} })();
}

// ------------------------------------------------------------ navegación
function pintarNav() {
  const h = location.hash || "#/panel";
  const a = S.actual;
  const item = (href, txt, extra = "") => `<a href="${href}" class="${h.startsWith(href) ? "on" : ""}">${txt}${extra}</a>`;
  let html = item("#/panel", "▦ Panel") + item("#/analizar", "＋ Nuevo análisis");
  html += `<div class="sep">Vertientes</div>`;
  const etiquetas = [];
  for (const r of ["seo", "sem", "geo"]) {
    const c = a && a.capas ? a.capas[r] : null;
    const pts = a && a.ramas.includes(r) ? `<span class="pts" title="${c && c.total != null ? "Nota global" : "Solo en la web"}">${c && c.total != null ? c.total : a.puntuaciones[r] + "*"}</span>` : "";
    html += `<a href="#/rama/${r}/analisis" class="${h.startsWith("#/rama/" + r) ? "on" : ""}"><span class="punto" style="background:var(--${r})"></span>${RAMAS[r].nombre} <span class="sub">${RAMAS[r].corto}</span>${pts}</a>`;
  }
  const abiertas = S.ext ? S.ext.acciones.filter(x => x.estado === "pendiente" || x.estado === "en_curso").length : 0;

    <tr><th>Problema</th><th>Afecta a</th><th>Severidad</th></tr>

    </table></div></div>
    <div>${resumenAcciones()}<h2>Evolución (en la web)</h2><div class="card pad">${evol}</div>
    <h2>Resumen</h2><div class="card pad"><div class="grid2" style="gap:6px 16px">
      ${SEVS.map(s => `<div><span class="sev s-${s}">${s}</span> <b style="float:right">${a.issues.filter(i => i.severidad === s).length}</b></div>`).join("")}

function grafico(host) {
  const serie = S.lista.filter(x => x.host === host && x.puntuaciones).slice(0, 12).reverse();
  if (serie.length < 2) return `<p class="sub" style="margin:0">Cuando vuelvas a analizar esta web verás aquí cómo evoluciona cada vertiente.</p>`;
  const W = 460, H = 170, px = 34, py = 18;
  const x = i => px + i * (W - px - 12) / (serie.length - 1), y = v => py + (100 - v) * (H - 2 * py) / 100;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for (const v of [0, 50, 100]) s += `<line x1="${px}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="#ecebe7"/><text x="${px - 8}" y="${y(v) + 4}" font-size="10" fill="#8b919b" text-anchor="end">${v}</text>`;
  const etiquetas = [];
  for (const r of ["seo", "sem", "geo"]) {
    const pts = serie.map((p, i) => p.puntuaciones[r] != null && p.ramas.includes(r) ? [x(i), y(p.puntuaciones[r]), p.puntuaciones[r]] : null).filter(Boolean);
    if (!pts.length) continue;
    s += `<polyline fill="none" stroke="var(--${r})" stroke-width="2.2" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`;
    pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--${r})"><title>${r.toUpperCase()}: ${p[2]}</title></circle>`);
    const u = pts[pts.length - 1]; etiquetas.push({r, x: u[0], y: u[1] - 7, v: u[2]});
  }
  etiquetas.sort((a, b) => a.y - b.y);
  for (let i = 1; i < etiquetas.length; i++) if (etiquetas[i].y - etiquetas[i - 1].y < 12) etiquetas[i].y = etiquetas[i - 1].y + 12;
  etiquetas.forEach(e => s += `<text x="${e.x - 6}" y="${e.y}" font-size="10.5" font-weight="700" fill="var(--${e.r})" text-anchor="end">${e.r.toUpperCase()} ${e.v}</text>`);
  return s + `</svg><div class="sub" style="font-size:12px">Últimos ${serie.length} análisis de ${esc(host)}</div>`;
}

async function optimizarIA(r) {

    const msg = est.simulado

      : `Se optimizarán ${est.paginas} página(s) de ${r.toUpperCase()} con ${est.modelo}.\n\nCoste aproximado: ${pc2(est.coste_aprox_usd)} $ (se cobra en tu cuenta de Anthropic; el coste real suele ser menor).\n\nDespués se aplicarán todas las correcciones al HTML descargado de tu web. Puedes revisarlas y cambiarlas antes de publicar.`;
    if (!confirm(msg)) return;

    S.iaTrabajo = S.iaTrabajo || {};

    S.destino = "subidos"; render();
    for (;;) {
      await new Promise(ok => setTimeout(ok, 1500));
      const t = await api("/api/trabajo/" + trabajo);
      S.iaTrabajo[r] = t;
      if (t.estado === "error") { S.iaTrabajo[r] = null; render(); return toast(t.error, true); }
      if (t.estado === "terminado") {
        S.iaTrabajo[r] = null;
        const res = t.resultado;
        S.ultimoResultado = {rama: r, destino: "subidos", aplicados: res.aplicados, omitidos: res.omitidos,
                             descargadas: res.descargadas, fallidas: res.fallidas, ia: res.ia};
        (res.aplicados || []).forEach(id => delete S.sel[r][id]);
        S.edLocales = {};
        await abrir(a.id); render();
        return toast(`IA: ${res.ia.paginas || 0} páginas optimizadas · ${res.aplicados.length} cambios aplicados`);
      }
      if (location.hash.startsWith(`#/rama/${r}/solucionar`)) render();

async function lanzar(cfg) {
  if (!cfg.url || !cfg.url.trim()) return toast("Escribe la dirección de la web", true);
  if (!cfg.ramas || !cfg.ramas.length) return toast("Elige al menos una vertiente", true);
  S.form = JSON.parse(JSON.stringify(cfg));
  try {
    const {trabajo} = await api("/api/analizar", {body: cfg});
    S.trabajo = {paginas: 0, max: cfg.max_paginas || 200};
    location.hash = "#/analizar"; render();
    while (true) {
      await new Promise(r => setTimeout(r, 600));
      const t = await api("/api/trabajo/" + trabajo);

      if (t.estado === "error") { S.trabajo = null; render(); return toast(t.error, true); }

        await cargarLista(); await abrir(t.analisis);

}

    </table></div></div>
    <div><h2 style="margin-top:0">Dónde descargar cada informe</h2><div class="card pad" style="font-size:13.5px">
      <p><b>Google Ads · Palabras clave</b><br>En la tabla de palabras clave de búsqueda, añade la columna «Nivel de calidad» y descarga en CSV. Elige un periodo de al menos 30 días.</p>
      <p><b>Google Ads · Términos de búsqueda</b><br>En «Términos de búsqueda», descarga la tabla en CSV con las columnas de coste y conversiones.</p>
      <p style="margin-bottom:0"><b>Search Console · Enlaces</b><br>En «Enlaces», abre «Sitios web con más enlaces» y exporta la tabla.</p>
      <p class="sub" style="font-size:12.5px;margin-bottom:0">Cuando tengas acceso a la API de Google Ads, esto se podrá hacer automáticamente.</p></div></div></div>`;
}
async function subir(files) {
  for (const f of files) {
    try {
      const contenido = await new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(f); });
      const res = await api(`/api/proyecto/${S.actual.proyecto}/importar`, {body: {nombre: f.name, contenido}});
      toast(`${f.name}: importado (${res.importados.map(i => i.tipo.replace("_", " ")).join(", ")})`);
    } catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  await refrescar();
}

function extMonitor() {
  const e = S.ext, m = e.monitor, aj = e.ajustes;
  if (!S.mon || S.mon._p !== e.proyecto) {
    S.mon = {_p: e.proyecto, marca: e.perfil.marca || "", alias: (e.perfil.alias || []).join(", "), dominio: e.perfil.dominio || "",
             ciudad: e.perfil.ciudad || "", preguntas: (m.config.preguntas || []).join("\n"),
             competidores: (m.config.competidores || []).map(c => ({...c})), motores: [...(m.config.motores || [])],
             repeticiones: m.config.repeticiones || 2};
  }
  const M = S.mon, demo = S.actual.demo;
  const nPreg = M.preguntas.split("\n").filter(x => x.trim()).length;
  const motoresOk = demo ? ["simulado"] : M.motores.filter(x => aj.claves[x]);
  const llamadas = nPreg * motoresOk.length * M.repeticiones;
  let html = `<div class="grid2" style="align-items:start"><div class="card pad">
    <h3>Qué preguntar y a quién</h3>
    <div class="fila"><div><label class="f">Tu marca</label><input class="i" value="${esc(M.marca)}" oninput="S.mon.marca=this.value"></div>
    <div><label class="f">Otros nombres (separados por comas)</label><input class="i" value="${esc(M.alias)}" oninput="S.mon.alias=this.value"></div></div>
    <div class="fila"><div><label class="f">Tu dominio</label><input class="i" value="${esc(M.dominio)}" oninput="S.mon.dominio=this.value" placeholder="miempresa.com"></div>
    <div><label class="f">Ciudad o zona</label><input class="i" value="${esc(M.ciudad)}" oninput="S.mon.ciudad=this.value"></div></div>
    <label class="f">Preguntas de tus clientes (una por línea)</label>
    <textarea class="i" rows="6" oninput="S.mon.preguntas=this.value" placeholder="mejor empresa de reformas en Madrid">${esc(M.preguntas)}</textarea>
    <div class="ayuda">Escribe como pregunta un cliente que aún no te conoce, sin nombrar tu marca.</div>
    <label class="f">Competidores</label>
    ${M.competidores.map((c, i) => `<div class="camp" style="grid-template-columns:1fr 1fr auto"><input class="i" placeholder="Nombre" value="${esc(c.nombre)}" oninput="S.mon.competidores[${i}].nombre=this.value">
      <input class="i" placeholder="dominio.com" value="${esc(c.dominio || "")}" oninput="S.mon.competidores[${i}].dominio=this.value">
      <button class="btn link" onclick="S.mon.competidores.splice(${i},1);render()">✕</button></div>`).join("")}
    <button class="btn peq" onclick="S.mon.competidores.push({nombre:'',dominio:''});render()">＋ Añadir competidor</button>
    <label class="f">Buscadores de IA</label>
    ${demo ? `<div class="sub">En la demostración se usan respuestas <b>simuladas</b>. Con tu web se consultan las APIs oficiales.</div>` :
      `<div class="ramasel" style="flex-wrap:wrap">${["gemini", "openai", "perplexity"].map(x => `<label title="${aj.claves[x] ? "" : "Falta la clave: añádela en Ajustes"}"><input type="checkbox" ${M.motores.includes(x) ? "checked" : ""} onchange="toggleMotor('${x}',this.checked)"> ${NOMBRE_MOTOR[x]} ${aj.claves[x] ? "" : `<span class="s-alta sev">sin clave</span>`}</label>`).join("")}</div>`}
    <div class="fila"><div><label class="f">Repeticiones por pregunta</label><select class="sel" onchange="S.mon.repeticiones=+this.value;render()">${[1, 2, 3, 4, 5].map(n => `<option ${M.repeticiones === n ? "selected" : ""}>${n}</option>`).join("")}</select>
      <div class="ayuda">Las respuestas varían: repetir da resultados más estables.</div></div>
      <div><label class="f">Consultas que se harán</label><b style="font-size:20px">${llamadas}</b>
      <div class="ayuda">${demo ? "Simuladas: sin coste." : "Cada consulta tiene coste en la API correspondiente: revisa sus precios actuales."}</div></div></div>
    <div class="barra"><button class="btn" onclick="guardarMonitor()">Guardar</button>
      <button class="btn geo" onclick="ejecutarMonitor()" ${S.monitorT || !llamadas ? "disabled" : ""}>▶ Ejecutar monitor</button>
      ${!demo && !motoresOk.length ? `<a href="#/ajustes">Añadir claves de API →</a>` : ""}</div>
    ${S.monitorT ? `<div class="progreso"><i style="width:${S.monitorT.total ? Math.round(100 * S.monitorT.hecho / S.monitorT.total) : 3}%"></i></div><div class="sub">${S.monitorT.hecho} de ${S.monitorT.total || "…"} consultas</div>` : ""}
    </div><div>${resultadosMonitor(m)}</div></div>`;
  return html;
}
function toggleMotor(x, on) { const s = new Set(S.mon.motores); on ? s.add(x) : s.delete(x); S.mon.motores = [...s]; render(); }
async function guardarMonitor(silencio) {
  const M = S.mon, p = S.actual.proyecto;
  try {
    await api(`/api/proyecto/${p}/perfil`, {body: {marca: M.marca, alias: M.alias, dominio: M.dominio, ciudad: M.ciudad}});
    S.ext = await api(`/api/proyecto/${p}/monitor/config`, {body: {preguntas: M.preguntas.split("\n"), competidores: M.competidores,
      motores: M.motores, repeticiones: M.repeticiones}});
    if (!silencio) toast("Configuración guardada");
    return true;
  } catch (e) { toast(e.message, true); return false; }
}
async function ejecutarMonitor() {
  if (!await guardarMonitor(true)) return;
  try {
    const {trabajo} = await api(`/api/proyecto/${S.actual.proyecto}/monitor/ejecutar`, {body: {}});
    S.monitorT = {hecho: 0, total: 0}; render();
    while (true) {
      await new Promise(r => setTimeout(r, 700));
      const t = await api("/api/trabajo/" + trabajo);
      S.monitorT = t; if (location.hash.startsWith("#/externo/monitor")) render();
      if (t.estado === "error") { S.monitorT = null; render(); return toast(t.error, true); }
      if (t.estado === "terminado") { S.monitorT = null; toast("Monitor completado"); return refrescar(); }
    }
  } catch (e) { S.monitorT = null; render(); toast(e.message, true); }
}
function resultadosMonitor(m) {
  const u = m.ultima;
  if (!u) return `<div class="card pad"><h3>Resultados</h3><p class="sub">Todavía no has ejecutado el monitor. Verás en qué porcentaje de respuestas aparece tu marca, frente a tus competidores, y qué webs cita la IA cuando habla de tu sector.</p></div>`;
  const r = u.resumen, marca = Object.keys(r.cuota)[0];
  const max = Math.max(1, ...Object.values(r.cuota).map(v => v || 0));
  let h = `<div class="card pad"><div style="display:flex;gap:10px;align-items:center"><h3 style="flex:1">Presencia en respuestas de IA</h3>${u.simulado ? `<span class="simul">Datos simulados</span>` : ""}</div>
    <div class="sub" style="font-size:12.5px">${fecha(u.fecha)} · ${r.respuestas} respuestas · ${u.motores.map(x => NOMBRE_MOTOR[x] || x).join(", ")}${r.errores ? ` · <span class="no">${r.errores} errores</span>` : ""}</div>
    <div style="margin-top:10px">${Object.entries(r.cuota).sort((a, b) => (b[1] || 0) - (a[1] || 0)).map(([n, v]) => `<div class="barh ${n === marca ? "tu" : ""}"><span>${esc(n)}${n === marca ? " (tú)" : ""}</span><div class="b"><i style="width:${100 * (v || 0) / max}%"></i></div><span style="text-align:right">${pc(v)}</span></div>`).join("")}</div>
    <div class="sub" style="font-size:12px">% de respuestas en las que se menciona cada marca.</div></div>`;
  h += `<h2>Por buscador</h2><div class="card tabla"><table><tr><th>Buscador</th><th class="num">Respuestas</th><th class="num">Te menciona</th><th class="num">Cita tu web</th><th>Errores</th></tr>
    ${Object.entries(r.por_motor).map(([k, v]) => `<tr><td>${NOMBRE_MOTOR[k] || k}</td><td class="num">${v.respuestas}</td><td class="num">${pc(v.pct_mencion)}</td><td class="num">${pc(v.pct_cita_web)}</td><td class="sub" style="font-size:12px">${v.errores ? esc(v.error_ejemplo) : ""}</td></tr>`).join("")}</table></div>`;
  h += `<h2>Webs que cita la IA sobre tu sector</h2><div class="card tabla"><table><tr><th>Web</th><th>Tipo</th><th class="num">% respuestas</th><th class="num">Junto a tu marca</th></tr>
    ${r.fuentes.slice(0, 12).map(f => `<tr><td class="url">${esc(f.dominio)}</td><td>${f.tipo === "tercero" ? "Tercero" : f.tipo === "tu web" ? "<span class=si>Tu web</span>" : "Competidor"}</td><td class="num">${pc(f.pct)}</td><td class="num">${f.con_tu_marca}</td></tr>`).join("")}</table></div>
    <p class="sub" style="font-size:12.5px">Las webs de terceros que más cita la IA son donde más te conviene aparecer: se convierten en acciones del plan.</p>`;
  h += `<h2>Por pregunta</h2><div class="card tabla"><table><tr><th>Pregunta</th><th class="num">Te menciona</th><th>Recomienda a</th></tr>
    ${r.preguntas.map(q => `<tr><td>${esc(q.pregunta)}</td><td class="num ${q.pct_marca ? "" : "no"}">${pc(q.pct_marca)}</td><td>${esc(q.competidores.join(", "))}</td></tr>`).join("")}</table></div>`;
  if (u.respuestas && u.respuestas.length) h += `<details style="margin-top:10px"><summary>Ver las respuestas (${u.respuestas.length})</summary>${u.respuestas.slice(0, 40).map(x => `<div class="card pad" style="margin:8px 0;font-size:13px">
    <b>${NOMBRE_MOTOR[x.motor] || x.motor}</b> · ${esc(x.pregunta)} ${x.error ? `<span class="no">${esc(x.error)}</span>` : (x.menciona_marca ? `<span class="ok-v">te menciona</span>` : `<span class="pill">no te menciona</span>`)}
    ${x.texto ? `<p style="white-space:pre-wrap;margin:6px 0">${esc(x.texto.slice(0, 900))}${x.texto.length > 900 ? "…" : ""}</p>` : ""}
    ${(x.fuentes || []).length ? `<div class="sub" style="font-size:12px">Fuentes: ${x.fuentes.map(f => esc(f.url)).join(" · ")}</div>` : ""}</div>`).join("")}</details>`;
  if (m.historial.length > 1) h += `<h2>Evolución</h2><div class="card pad">${m.historial.map(x => `<div class="barh"><span class="sub">${fecha(x.fecha)}${x.simulado ? " (sim.)" : ""}</span><div class="b"><i style="width:${x.pct_mencion || 0}%;background:var(--geo)"></i></div><span style="text-align:right">${pc(x.pct_mencion)}</span></div>`).join("")}</div>`;
  return h;
}

function extResenas() {
  const e = S.ext, rs = e.resenas, wd = e.wikidata, demo = S.actual.demo;
  const consulta = S.consultaPlaces ?? [e.perfil.marca, e.perfil.ciudad].filter(Boolean).join(" ");
  const fila = (x, tu) => `<tr><td>${tu ? "<b>" : ""}${esc(x.nombre)}${tu ? " (tú)</b>" : ""}<div class="sub" style="font-size:12px">${esc(x.direccion || "")}</div></td>
    <td class="num">${x.nota != null ? String(x.nota).replace(".", ",") + " ★" : "—"}</td><td class="num">${x.resenas}</td><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">Ver en Maps</a>` : ""}</td></tr>`;
  return `<div class="grid2" style="align-items:start"><div><div class="card pad"><h3>Reseñas en Google</h3>
    <p class="sub">Busca tu empresa y la de tus competidores en Google Maps (API de Google Places). Los competidores son los del monitor de IA.</p>
    <div class="camp" style="grid-template-columns:1fr auto"><input class="i" id="q-places" value="${esc(consulta)}" oninput="S.consultaPlaces=this.value" placeholder="Nombre de la empresa y ciudad">
    <button class="btn pri" onclick="postExt('resenas',{consulta:$('#q-places').value},'Reseñas actualizadas')" ${demo || e.ajustes.claves.places ? "" : "disabled"}>Buscar</button></div>
    ${demo || e.ajustes.claves.places ? "" : `<div class="ayuda">Falta la clave de Google Places: <a href="#/ajustes">añádela en Ajustes</a>.</div>`}</div>
    ${rs ? `<div class="card tabla" style="margin-top:14px"><table><tr><th>Empresa</th><th class="num">Nota</th><th class="num">Reseñas</th><th></th></tr>
      ${rs.tu ? fila(rs.tu, true) : `<tr><td colspan="4" class="no">No se encontró tu empresa con esa búsqueda.</td></tr>`}
      ${rs.competidores.map(x => fila(x)).join("")}</table></div>
      <p class="sub" style="font-size:12.5px">${rs.simulado ? `<span class="simul">Datos de ejemplo</span> ` : ""}Actualizado ${fecha(rs.fecha)}. Criterio de Tríada: «sí» con tantas reseñas como la mediana de tus competidores y nota ≥ 4,3.</p>` : ""}</div>
    <div><div class="card pad"><h3>Entidad en Wikidata</h3><p class="sub">Comprueba si tu empresa tiene ficha en Wikidata, una fuente de entidades que usan buscadores e IA. Es gratuito.</p>
      <button class="btn" onclick="postExt('wikidata',{},'Wikidata comprobado')">Comprobar «${esc(e.perfil.marca || "tu marca")}»</button>
      ${wd ? `<div style="margin-top:12px">${wd.coincide ? `<span class="ok-v">Coincidencia exacta</span>` : `<span class="pill">Sin coincidencia exacta</span>`}
        ${wd.candidatos.length ? `<ul style="font-size:13px">${wd.candidatos.map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.nombre)}</a> <span class="sub">${esc(c.id)} · ${esc(c.descripcion)}</span></li>`).join("")}</ul>` : ""}
        <p class="sub" style="font-size:12.5px">Comprueba que la coincidencia es realmente tu empresa. Si no tienes ficha, crearla es una acción del plan.</p></div>` : ""}</div></div></div>`;
}

// ------------------------------------------------------------ ajustes
function vistaAjustes() {
  const aj = S.ajustes || (S.ext && S.ext.ajustes);
  if (!aj) { api("/api/ajustes").then(a => { S.ajustes = a; render(); }); return cabecera("Ajustes") + `<div class="card pad">Cargando…</div>`; }
  const clave = (k, titulo, ayuda) => `<label class="f">${titulo} ${aj.claves[k] ? `<span class="ok-v">configurada</span>` : ""}</label>
    <input class="i" type="password" id="k-${k}" placeholder="${aj.claves[k] ? "•••••••• (déjalo vacío para mantenerla)" : "Pega aquí la clave"}" autocomplete="off"><div class="ayuda">${ayuda}</div>`;
  return cabecera("Ajustes", "Claves de API, modelos y pesos de la nota global") + `<div class="grid2" style="align-items:start">
    <div class="card pad"><h3>Claves de API</h3><p class="sub" style="margin-bottom:0">Se guardan solo en tu ordenador, en la carpeta de datos de Tríada. No se envían a ningún sitio salvo a la API correspondiente.</p>
      ${clave("anthropic", "Claude (Anthropic) · para «Optimizar con IA»", "Se crea en console.anthropic.com → API Keys. Tiene coste por uso (con el modelo por defecto, del orden de céntimos por página).")}
      ${clave("gemini", "Gemini (Google AI Studio)", "Se crea en Google AI Studio, vinculada a tu proyecto de Google Cloud. Según Google, las búsquedas de Gemini 3 incluyen 5.000 gratis al mes; después tienen coste por búsqueda.")}
      ${clave("openai", "OpenAI (ChatGPT)", "Se crea en la plataforma de desarrolladores de OpenAI. Usa la búsqueda web de la Responses API (tiene coste por búsqueda).")}
      ${clave("perplexity", "Perplexity", "Se crea en la configuración de API de Perplexity (modelo sonar).")}
      ${clave("places", "Google Places", "Activa «Places API (New)» en tu proyecto de Google Cloud y crea una clave restringida a esa API. La nota y el número de reseñas se facturan en el nivel Enterprise de Text Search.")}
      <h3 style="margin-top:20px">Modelos</h3>
      <label class="f">Claude (Optimizar con IA)</label><input class="i" id="m-claude" value="${esc(aj.modelos.claude || "claude-opus-5-5")}">
      <div class="ayuda">Por defecto claude-opus-5-5. Para gastar menos puedes poner claude-sonnet-5-5.</div>
      <div class="fila">${["gemini", "openai", "perplexity"].map(k => `<div><label class="f">${NOMBRE_MOTOR[k]}</label><input class="i" id="m-${k}" value="${esc(aj.modelos[k])}"></div>`).join("")}</div>
      <div class="ayuda">Valores por defecto según la documentación oficial actual. Cámbialos si el proveedor publica uno nuevo.</div></div>
    <div class="card pad"><h3>Peso de «en la web» en la nota global</h3><p class="sub">El resto corresponde a lo de fuera de la web (señales externas y resultado real). Es un criterio de Tríada, no una cifra oficial: ajústalo a tu negocio.</p>
      <p class="sub" style="font-size:12.5px">El SEO no tiene peso externo: se evalúa solo con lo que hay en la web.</p>
      ${["sem", "geo"].map(r => `<label class="f"><span class="tag t-${r}">${r.toUpperCase()}</span> En la web <b id="pv-${r}">${Math.round(aj.pesos[r] * 100)}</b> % · fuera <b id="pf-${r}">${100 - Math.round(aj.pesos[r] * 100)}</b> %</label>
        <input type="range" min="0" max="100" step="5" id="p-${r}" value="${Math.round(aj.pesos[r] * 100)}" style="width:100%" oninput="$('#pv-${r}').textContent=this.value;$('#pf-${r}').textContent=100-this.value">`).join("")}
    </div></div><div class="barra"><button class="btn pri" onclick="guardarAjustes()">Guardar ajustes</button></div>`;
}
async function guardarAjustes() {
  const claves = {}, modelos = {}, pesos = {};
  for (const k of ["anthropic", "gemini", "openai", "perplexity", "places"]) { const v = $("#k-" + k).value.trim(); if (v) claves[k] = v; }
  for (const k of ["claude", "gemini", "openai", "perplexity"]) modelos[k] = $("#m-" + k).value.trim();
  for (const r of ["sem", "geo"]) pesos[r] = +$("#p-" + r).value / 100;
  try { S.ajustes = await api("/api/ajustes", {body: {claves, modelos, pesos}}); toast("Ajustes guardados"); await refrescar(); }
  catch (e) { toast(e.message, true); }
}

// ------------------------------------------------------------ inicio
(async function () {
  try {
    S.info = await api("/api/info");
    await cargarLista();
    let id = null; try { id = localStorage.getItem("triada.actual"); } catch {}
    if (!S.lista.some(x => x.id === id)) id = S.lista[0] && S.lista[0].id;
    await abrir(id);
  } catch (e) { toast("No se pudo conectar con Tríada: " + e.message, true); }
  render();
})();
